[project]
name = "pxr-challenge"
version = "0.1.0"
description = "OpenADMET PXR Blind Challenge — activity + structure tracks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rdkit>=2024.3",
    "pandas>=2.2",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "lightgbm>=4.3",
    "tqdm>=4.66",
    "pyarrow>=15",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "useful-rdkit-utils>=0.4",
    "datamol>=0.12",
    "mols2grid>=2.0",
    "umap-learn>=0.5",
    "datasets>=2.20",
    "polars>=1.0",
    "chemprop>=2.1",
    "lightning>=2.3",
    "chembl-webresource-client>=0.10",
    "requests>=2.31",
    "imbalanced-learn>=0.12",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "sentencepiece>=0.2",
    "accelerate>=0.30",
    "optuna>=4.8.0",
    "unimol-tools>=0.1.5",
    "torch-geometric>=2.7.0",
    "gdown>=6.0.0",
    "selfies>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pxr"]

[tool.uv]
package = true

# Route torch to the CPU-only wheel index; all other packages stay on PyPI.
# To use GPU, change the url to https://download.pytorch.org/whl/cu124
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
